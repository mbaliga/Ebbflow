name: Path lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-path-lint:
    name: tracked paths are valid on Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint tracked paths
        run: bash scripts/windows-path-lint.sh
