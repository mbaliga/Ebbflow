name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  community-core-tests:
    name: community EEG core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run community core tests
        run: ./gradlew :core-eeg-community:test --no-daemon --console=plain
