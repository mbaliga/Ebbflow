name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-eeg-tests:
    name: core-eeg unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run :core-eeg tests
        run: ./gradlew :core-eeg:test --no-daemon --console=plain
